[workspace]
members = ["stark", "stark-ffi"]
exclude = ["vendor/p3-matrix", "vendor/p3-fri", "vendor/p3-batch-stark"]
default-members = ["stark"]
resolver = "3"

[patch."https://github.com/Plonky3/Plonky3"]
p3-matrix = { path = "vendor/p3-matrix" }
p3-fri = { path = "vendor/p3-fri" }
p3-batch-stark = { path = "vendor/p3-batch-stark" }

[profile.release]
overflow-checks = true
